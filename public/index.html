<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabStudio Liquid Glass</title>
    <style>
        :root {
            --bg-base: #050b14;
            --glass-bg: rgba(17, 24, 39, 0.65);
            --glass-card: rgba(15, 23, 42, 0.5);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 360px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
        }

        .sidebar-header {
            padding: 20px 20px 14px 20px;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
        }

        .sidebar-header span {
            color: var(--accent);
            font-size: 11px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .search-container {
            padding: 14px 20px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(10, 15, 28, 0.4);
        }

        #search-input {
            width: 100%;
            padding: 9px 12px;
            background: rgba(5, 11, 20, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        #search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        #song-list {
            flex: 1;
            overflow-y: auto;
        }

        .song-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.15s ease;
        }

        .song-item:hover {
            background: rgba(56, 189, 248, 0.06);
            padding-left: 24px;
        }

        .song-item.active {
            background: rgba(56, 189, 248, 0.12);
            border-left: 3px solid var(--accent);
            border-bottom-color: var(--glass-border);
        }

        .song-item strong {
            display: block;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 2px;
        }

        .song-item span {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Main View */
        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        .viewer-header {
            padding: 14px 24px;
            border-bottom: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            z-index: 10;
        }

        .song-meta h1 {
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .song-meta h3 {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: normal;
        }

        .toolbar-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 15, 28, 0.5);
            border: 1px solid var(--glass-border);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .toolbar-group label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--glass-border-hover);
        }

        .btn-primary {
            background: var(--accent);
            color: #050b14;
            border-color: transparent;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .btn-success {
            background: var(--success);
            color: #050b14;
            border-color: transparent;
        }
        .btn-success:hover { opacity: 0.9; box-shadow: 0 0 12px rgba(16, 185, 129, 0.4); }

        input[type="range"] {
            accent-color: var(--accent);
            cursor: pointer;
            width: 70px;
        }

        /* Content Scroll Wrapper */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 35px;
            display: flex;
            justify-content: center;
        }

        .content-wrapper {
            max-width: 950px;
            width: 100%;
        }

        /* Liquid Glass Tab Card */
        pre#song-content {
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #f1f5f9;
            background: var(--glass-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            white-space: pre;
            overflow-x: auto;
        }

        /* Chord Pill Highlighting */
        .chord {
            display: inline-block;
            background: rgba(56, 189, 248, 0.18);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: bold;
        }

        .placeholder-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
        }

        .placeholder-state svg {
            width: 44px;
            height: 44px;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            TabStudio <span id="song-count">Loading...</span>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search artist or title...">
        </div>
        <div id="song-list"></div>
    </div>

    <!-- Main View -->
    <div id="main-view">
        <div class="viewer-header" id="viewer-header" style="display: none;">
            <div class="song-meta">
                <h1 id="song-title"></h1>
                <h3 id="song-artist"></h3>
            </div>

            <div class="toolbar-container">
                <!-- Transpose Controls -->
                <div class="toolbar-group">
                    <label>Key:</label>
                    <button class="btn" onclick="transpose(-1)">-1</button>
                    <span id="transpose-val" style="font-size: 11px; font-weight: bold; min-width: 16px; text-align: center;">0</span>
                    <button class="btn" onclick="transpose(1)">+1</button>
                    <button class="btn btn-success" onclick="suggestEasyKey()" title="Shift to C Major / A Minor">Easy</button>
                </div>

                <!-- Auto Scroll Controls -->
                <div class="toolbar-group">
                    <label>Scroll:</label>
                    <button class="btn btn-primary" id="autoscroll-btn" onclick="toggleAutoScroll()">Play ⏵</button>
                    <input type="range" id="scroll-speed" min="1" max="5" value="1">
                </div>

                <!-- Font & Copy -->
                <div class="toolbar-group">
                    <button class="btn" onclick="adjustFontSize(1)">A+</button>
                    <button class="btn" onclick="adjustFontSize(-1)">A-</button>
                    <button class="btn" onclick="copyChords()" id="copy-btn">Copy</button>
                </div>
            </div>
        </div>

        <div class="content-scroll" id="content-scroll-container">
            <div id="placeholder" class="placeholder-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                </svg>
                <p>Select a song from your library to start playing</p>
            </div>
            <div class="content-wrapper" id="content-wrapper" style="display: none;">
                <pre id="song-content"></pre>
            </div>
        </div>
    </div>

    <script>
        let allSongs = [];
        let currentFontSize = 14;
        let originalSongContent = "";
        let currentSemitone = 0;
        let autoScrollInterval = null;
        let isScrolling = false;

        const songListDiv = document.getElementById('song-list');
        const searchInput = document.getElementById('search-input');
        const viewerHeader = document.getElementById('viewer-header');
        const titleEl = document.getElementById('song-title');
        const artistEl = document.getElementById('song-artist');
        const contentEl = document.getElementById('song-content');
        const contentWrapper = document.getElementById('content-wrapper');
        const placeholderEl = document.getElementById('placeholder');
        const songCountEl = document.getElementById('song-count');
        const scrollContainer = document.getElementById('content-scroll-container');
        const scrollSpeedInput = document.getElementById('scroll-speed');
        const autoscrollBtn = document.getElementById('autoscroll-btn');
        const transposeValEl = document.getElementById('transpose-val');

        fetch('/api/songs')
            .then(res => res.json())
            .then(songs => {
                allSongs = songs;
                songCountEl.textContent = `${songs.length} tabs`;
                renderSongList(songs);
            })
            .catch(() => {
                songCountEl.textContent = 'Error';
                songListDiv.innerHTML = '<div style="padding: 20px; color: #f87171;">Failed to load catalog.</div>';
            });

        function renderSongList(songsToRender) {
            songListDiv.innerHTML = '';
            songsToRender.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-item';

                const isHebrew = /[\u0590-\u05FF]/.test(song.Title) || /[\u0590-\u05FF]/.test(song.Artist);
                item.style.direction = isHebrew ? 'rtl' : 'ltr';
                item.style.textAlign = isHebrew ? 'right' : 'left';

                item.innerHTML = `<strong>${song.Title}</strong><span>${song.Artist}</span>`;

                item.addEventListener('click', () => {
                    stopAutoScroll();
                    document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');

                    placeholderEl.style.display = 'none';
                    viewerHeader.style.display = 'flex';
                    contentWrapper.style.display = 'block';

                    titleEl.textContent = song.Title;
                    artistEl.textContent = song.Artist;
                    contentEl.textContent = "Loading chords...";
                    currentSemitone = 0;
                    transposeValEl.textContent = "0";

                    fetch(`/api/scrape?url=${encodeURIComponent(song.URL)}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.error) {
                                contentEl.textContent = "Error loading song.";
                                return;
                            }

                            originalSongContent = data.content;
                            renderFormattedSong(originalSongContent);

                            contentEl.style.direction = isHebrew ? 'rtl' : 'ltr';
                            contentEl.style.textAlign = isHebrew ? 'right' : 'left';
                        })
                        .catch(() => {
                            contentEl.textContent = "Failed to fetch song content.";
                        });
                });
                songListDiv.appendChild(item);
            });
        }

        const chordRegex = /(^|\s)([A-G][#b]?(?:m|maj|min|dim|aug|sus|add|[0-9])*(?:\/[A-G][#b]?)?)(?=\s|$)/g;

        function renderFormattedSong(textContent) {
            const lines = textContent.split('\n');

            const formattedLines = lines.map(line => {
                const trimmed = line.trim();
                if (trimmed.length > 0 && /^[A-G]/.test(trimmed)) {
                    const words = trimmed.split(/\s+/);
                    const singleCheck = /^([A-G][#b]?(?:m|maj|min|dim|aug|sus|add|[0-9])*(?:\/[A-G][#b]?)?)$/;
                    const chordCount = words.filter(w => singleCheck.test(w)).length;

                    if (chordCount / words.length >= 0.3) {
                        return line.replace(chordRegex, '$1<span class="chord">$2</span>');
                    }
                }
                return escapeHtml(line);
            });

            contentEl.innerHTML = formattedLines.join('\n');
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allSongs.filter(song =>
                song.Title.toLowerCase().includes(query) ||
                song.Artist.toLowerCase().includes(query)
            );
            renderSongList(filtered);
        });

        const noteToPitch = {
            'C': 0, 'B#': 0,
            'C#': 1, 'Db': 1,
            'D': 2,
            'D#': 3, 'Eb': 3,
            'E': 4, 'Fb': 4,
            'F': 5, 'E#': 5,
            'F#': 6, 'Gb': 6,
            'G': 7,
            'G#': 8, 'Ab': 8,
            'A': 9,
            'A#': 10, 'Bb': 10,
            'B': 11, 'Cb': 11
        };
        const pitchToNoteSharp = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        function shiftChordText(text, semitones) {
            if (semitones === 0) return text;
            return text.replace(chordRegex, (match, prefix, chord) => {
                let parts = chord.split('/');
                let transposedRoot = shiftSingleChord(parts[0], semitones);
                if (parts.length > 1) {
                    let transposedBass = shiftSingleChord(parts[1], semitones);
                    return prefix + transposedRoot + '/' + transposedBass;
                }
                return prefix + transposedRoot;
            });
        }

        function shiftSingleChord(chord, semitones) {
            let rootMatch = chord.match(/^([A-G][#b]?)(.*)$/);
            if (!rootMatch) return chord;
            let note = rootMatch[1];
            let suffix = rootMatch[2];

            let basePitch = noteToPitch[note];
            if (basePitch === undefined) return chord;

            let newPitch = (basePitch + semitones + 12) % 12;
            return pitchToNoteSharp[newPitch] + suffix;
        }

        function transpose(amount) {
            if (!originalSongContent) return;
            currentSemitone += amount;
            transposeValEl.textContent = (currentSemitone > 0 ? "+" : "") + currentSemitone;
            const transposedText = shiftChordText(originalSongContent, currentSemitone);
            renderFormattedSong(transposedText);
        }

        // Smart Easy Key Transposer: detects first chord and shifts song to C Major or A Minor
        function suggestEasyKey() {
            if (!originalSongContent) return;

            // Find the first valid chord in the song
            const match = originalSongContent.match(chordRegex);
            if (!match) return;

            let firstChord = match[0].trim();
            let rootMatch = firstChord.match(/^([A-G][#b]?)/);
            if (!rootMatch) return;

            let rootNote = rootMatch[1];
            let isMinor = firstChord.includes('m') && !firstChord.includes('maj');

            let currentPitch = noteToPitch[rootNote];
            if (currentPitch === undefined) return;

            // Target easy key: C (pitch 0) for major, Am (pitch 9) for minor
            let targetPitch = isMinor ? 9 : 0;
            let semitonesNeeded = (targetPitch - currentPitch + 12) % 12;
            if (semitonesNeeded > 6) semitonesNeeded -= 12;

            currentSemitone = semitonesNeeded;
            transposeValEl.textContent = (currentSemitone > 0 ? "+" : "") + currentSemitone;
            const transposedText = shiftChordText(originalSongContent, currentSemitone);
            renderFormattedSong(transposedText);
        }

        function resetTranspose() {
            currentSemitone = 0;
            transposeValEl.textContent = "0";
            renderFormattedSong(originalSongContent);
        }

        function toggleAutoScroll() {
            if (isScrolling) {
                stopAutoScroll();
            } else {
                startAutoScroll();
            }
        }

        function startAutoScroll() {
            isScrolling = true;
            autoscrollBtn.textContent = 'Pause ⏸';
            autoscrollBtn.style.backgroundColor = 'var(--warning)';

            autoScrollInterval = setInterval(() => {
                const speed = parseInt(scrollSpeedInput.value);
                scrollContainer.scrollTop += speed * 0.6;

                if (scrollContainer.scrollTop + scrollContainer.clientHeight >= scrollContainer.scrollHeight - 5) {
                    stopAutoScroll();
                }
            }, 60);
        }

        function stopAutoScroll() {
            isScrolling = false;
            clearInterval(autoScrollInterval);
            autoscrollBtn.textContent = 'Play ⏵';
            autoscrollBtn.style.backgroundColor = 'var(--accent)';
        }

        function adjustFontSize(delta) {
            currentFontSize = Math.max(11, Math.min(22, currentFontSize + delta));
            contentEl.style.fontSize = currentFontSize + 'px';
        }

        function copyChords() {
            navigator.clipboard.writeText(contentEl.innerText).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 2000);
            });
        }
    </script>
</body>
</html>
