<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabStudio Liquid Glass</title>
    <style>
        /* === Tab4U Native Stylesheet Integration === */
        @font-face{
            font-family:'open sans hebrew';
            font-style:normal;
            src:url('fontOS.eot');
            src:local('open sans hebrew'), url('fontOS.eot') format('embedded-opentype'), url('fontOS.woff') format('woff');
            font-display:swap;
        }
        @font-face{font-family:'fontCR';src:url('../fontCR.ttf');font-display:swap;}

        #songContentTPL{min-height:460px; position:relative;}
        #songContentTPL table{border-spacing:0px 2px; border-collapse:collapse; width:auto;}
        #songContentTPL td, #songContentTPL th{padding:0; margin:0; white-space:pre; vertical-align:baseline; border:none !important;}
        .chords .c_C, .chords_en .c_C, .noCI{border-radius:4px; padding:0px 3px; margin:0px -3px; color:#2566F1 !important; background:#DFE8FE !important;}
        .monospaceFont{font-family:fontCR, "Courier New", Courier, Droid Sans Mono, monospace !important;}
        #songContent .chords, .song_block .chords{font-family:fontCR, "Courier New", Courier, Droid Sans Mono, monospace !important; padding-top:4px; direction:ltr; font-size:14px; text-align:right;}
        #songContent .chords_en, .song_block .chords_en{font-family:fontCR, "Courier New", Courier, Droid Sans Mono, monospace !important; padding-top:4px; direction:ltr; font-size:14px; text-align:left;}
        #songContent .tabs, .song_block .tabs{color:#3e3e3e; font-family:fontCR, "Courier New", Courier, Droid Sans Mono, monospace !important; direction:ltr; font-size:14px; white-space:nowrap;}
        #songContent .song, .song_block .song{font-family:fontCR, "Courier New", Courier, Droid Sans Mono, monospace !important; font-size:14px; text-decoration:none;}

        /* === App Liquid Glass Theme Shell === */
        :root {
            --bg-base: #030712;
            --glass-bg: rgba(17, 24, 39, 0.7);
            --glass-card: rgba(15, 23, 42, 0.55);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-border-hover: rgba(56, 189, 248, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            font-family: 'open sans hebrew', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.15), transparent 35%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 35%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            scroll-behavior: smooth;
        }

        /* Mobile Header */
        #mobile-header {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 50;
        }
        #mobile-header h2 { font-size: 18px; font-weight: 700; }
        .hamburger {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 24px;
            cursor: pointer;
        }

        /* Overlay for mobile */
        #sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 90;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #sidebar-overlay.active { opacity: 1; }

        /* Sidebar */
        #sidebar {
            width: 380px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
            box-shadow: 15px 0 40px rgba(0, 0, 0, 0.4);
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 24px 24px 16px 24px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-header span {
            color: var(--bg-base);
            font-size: 11px;
            background: var(--accent);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Revamped Search Bar */
        .search-container {
            padding: 16px 24px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-wrapper svg {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        #search-input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        #search-input::placeholder { color: #64748b; }
        #search-input:focus {
            border-color: var(--accent);
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
        #search-input:focus + svg { color: var(--accent); }

        #song-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        /* Revamped Song Item - Artist Focused */
        .song-item {
            padding: 14px 24px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
            position: relative;
        }

        .song-item:hover {
            background: rgba(255, 255, 255, 0.04);
            padding-left: 28px;
        }

        .song-item.active {
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.15) 0%, transparent 100%);
            border-left: 4px solid var(--accent);
        }

        /* Artist is now visually primary */
        .song-item strong {
            display: block;
            color: var(--accent);
            font-size: 15px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .song-item span {
            font-size: 13px;
            color: var(--text-main);
            opacity: 0.85;
        }

        /* Main View */
        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background: transparent;
            position: relative;
        }

        .viewer-header {
            padding: 16px 35px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            z-index: 10;
        }

        .song-meta h1 { font-size: 22px; color: var(--text-main); margin-bottom: 4px; font-weight: 700;}
        .song-meta h3 { font-size: 14px; color: var(--accent); font-weight: 600; }

        .toolbar-container {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            padding: 6px 12px;
            border-radius: 12px;
        }

        .toolbar-group label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--glass-border-hover);
            transform: translateY(-1px);
        }
        
        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: var(--accent);
            color: #050b14;
            border-color: transparent;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
        }

        input[type="range"] {
            accent-color: var(--accent);
            cursor: pointer;
            width: 80px;
        }

        /* Content Scroll Wrapper */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .content-wrapper {
            max-width: 950px;
            width: 100%;
        }

        /* Native Container Wrapper */
        #song-content-container {
            font-family: fontCR, "Courier New", Courier, Droid Sans Mono, monospace;
            font-size: 15px;
            line-height: 1.6;
            color: #f1f5f9;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow-x: auto;
        }

        #song-content-container table { display: table; border-spacing: 0 1px; border-collapse: collapse; width: auto; margin: 0; }
        #song-content-container tbody { display: table-row-group; }
        #song-content-container tr { display: table-row; }
        #song-content-container td,
        #song-content-container th {
            display: table-cell;
            padding: 0; margin: 0;
            white-space: pre;
            vertical-align: baseline;
            border: none !important;
        }
        #song-content-container td.chords_en { direction: ltr; text-align: left; }
        #song-content-container td.chords { direction: ltr; text-align: right; }
        #song-content-container td.song { unicode-bidi: plaintext; text-align: start; }
        #song-content-container td.chords,
        #song-content-container td.chords_en { padding-top: 2px; }

        .chord, .c_C {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15) !important;
            color: var(--accent) !important;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 2px 6px !important;
            margin: 0 2px 0 0 !important;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .placeholder-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            margin-top: 20vh;
        }

        .placeholder-state svg {
            width: 56px; height: 56px;
            margin-bottom: 16px;
            color: rgba(255,255,255,0.1);
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.2));
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

        /* === MOBILE RESPONSIVE MEDIA QUERIES === */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            #mobile-header { display: flex; }
            
            #sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                width: 85%;
                max-width: 380px;
            }
            #sidebar.open { transform: translateX(0); }
            #sidebar-overlay { display: block; pointer-events: none; }
            #sidebar-overlay.active { pointer-events: auto; }

            .viewer-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 15px 20px;
            }
            
            .toolbar-container {
                width: 100%;
                justify-content: flex-start;
            }
            
            .content-scroll { padding: 20px 15px; }
            #song-content-container { padding: 20px; border-radius: 12px; }
        }
    </style>
</head>
<body>

    <!-- Mobile Header -->
    <div id="mobile-header">
        <h2>TabStudio</h2>
        <button class="hamburger" id="menu-toggle">☰</button>
    </div>

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            TabStudio <span id="song-count">Loading...</span>
        </div>
        <div class="search-container">
            <div class="search-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="search-input" placeholder="Search by Artist or Title...">
            </div>
        </div>
        <div id="song-list"></div>
    </div>

    <!-- Main View -->
    <div id="main-view">
        <div class="viewer-header" id="viewer-header" style="display: none;">
            <div class="song-meta">
                <h1 id="song-title"></h1>
                <h3 id="song-artist"></h3>
            </div>

            <div class="toolbar-container">
                <!-- Transpose Controls (0.5 steps = 1 semitone) -->
                <div class="toolbar-group">
                    <label>Key:</label>
                    <button class="btn" onclick="transpose(-0.5)">-0.5</button>
                    <span id="transpose-val" style="font-size: 13px; font-weight: bold; min-width: 32px; text-align: center;">0</span>
                    <button class="btn" onclick="transpose(0.5)">+0.5</button>
                    <button class="btn" id="simplify-btn" onclick="toggleSimplify()" style="margin-left: 4px; background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); color: var(--success);">Simplify</button>
                    <button class="btn" id="easiest-key-btn" onclick="toggleEasiestKey()" style="background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.4); color: var(--accent);">Easiest Key</button>
                </div>

                <!-- Auto Scroll Controls -->
                <div class="toolbar-group">
                    <label>Scroll:</label>
                    <button class="btn btn-primary" id="autoscroll-btn" onclick="toggleAutoScroll()">Play ⏵</button>
                    <input type="range" id="scroll-speed" min="1" max="5" value="1">
                </div>

                <!-- Font & Copy -->
                <div class="toolbar-group">
                    <button class="btn" onclick="adjustFontSize(1)">A+</button>
                    <button class="btn" onclick="adjustFontSize(-1)">A-</button>
                    <button class="btn" onclick="copyChords()" id="copy-btn">Copy</button>
                </div>
            </div>
        </div>

        <div class="content-scroll" id="content-scroll-container">
            <div id="placeholder" class="placeholder-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                </svg>
                <p>Select a track from your library to begin</p>
            </div>
            <div class="content-wrapper" id="content-wrapper" style="display: none;">
                <div id="song-content-container"></div>
            </div>
        </div>
    </div>

    <script>
        let allSongs = [];
        let currentFontSize = 15;
        let originalHtmlContent = "";
        let currentSemitone = 0;
        let previousSemitone = 0;
        let isSimplifyMode = false;
        let isEasiestMode = false;
        let autoScrollInterval = null;
        let isScrolling = false;

        const songListDiv = document.getElementById('song-list');
        const searchInput = document.getElementById('search-input');
        const viewerHeader = document.getElementById('viewer-header');
        const titleEl = document.getElementById('song-title');
        const artistEl = document.getElementById('song-artist');
        const songContainer = document.getElementById('song-content-container');
        const contentWrapper = document.getElementById('content-wrapper');
        const placeholderEl = document.getElementById('placeholder');
        const songCountEl = document.getElementById('song-count');
        const scrollContainer = document.getElementById('content-scroll-container');
        const scrollSpeedInput = document.getElementById('scroll-speed');
        const autoscrollBtn = document.getElementById('autoscroll-btn');
        const transposeValEl = document.getElementById('transpose-val');
        const simplifyBtn = document.getElementById('simplify-btn');
        const easiestKeyBtn = document.getElementById('easiest-key-btn');

        // Mobile Menu Logic
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const menuToggle = document.getElementById('menu-toggle');

        function toggleMenu() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function closeMenu() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        menuToggle.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', closeMenu);

        fetch('/api/songs')
            .then(res => res.json())
            .then(songs => {
                allSongs = songs;
                songCountEl.textContent = `${songs.length} tabs`;
                renderSongList(songs);
            })
            .catch(() => {
                songCountEl.textContent = 'Error';
                songListDiv.innerHTML = '<div style="padding: 20px; color: #f87171;">Failed to load catalog.</div>';
            });

        function renderSongList(songsToRender) {
            songListDiv.innerHTML = '';
            songsToRender.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-item';

                const isHebrew = /[\u0590-\u05FF]/.test(song.Title) || /[\u0590-\u05FF]/.test(song.Artist);
                item.style.direction = isHebrew ? 'rtl' : 'ltr';
                item.style.textAlign = isHebrew ? 'right' : 'left';

                // Display hierarchy flipped: Artist is bolded, title is muted
                item.innerHTML = `<strong>${song.Artist}</strong><span>${song.Title}</span>`;

                item.addEventListener('click', () => {
                    stopAutoScroll();
                    document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    
                    if (window.innerWidth <= 900) {
                        closeMenu(); // Auto close sidebar on mobile when a song is clicked
                    }

                    placeholderEl.style.display = 'none';
                    viewerHeader.style.display = 'flex';
                    contentWrapper.style.display = 'block';

                    titleEl.textContent = song.Title;
                    artistEl.textContent = song.Artist;
                    songContainer.innerHTML = "Loading native sheet...";
                    currentSemitone = 0;
                    previousSemitone = 0;
                    isSimplifyMode = false;
                    isEasiestMode = false;
                    transposeValEl.textContent = "0";
                    updateSimplifyUI();
                    updateEasiestKeyUI();

                    fetch(`/api/scrape?url=${encodeURIComponent(song.URL)}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.error) {
                                songContainer.innerHTML = "Error loading song.";
                                return;
                            }

                            originalHtmlContent = data.html;
                            renderFormattedSong(originalHtmlContent);

                            songContainer.style.direction = isHebrew ? 'rtl' : 'ltr';
                            songContainer.style.textAlign = isHebrew ? 'right' : 'left';
                            
                            updateSongDisplay();
                        })
                        .catch(() => {
                            songContainer.innerHTML = "Failed to fetch song content.";
                        });
                });
                songListDiv.appendChild(item);
            });
        }

        const chordRegex = /\b([A-G][#b]?(?:m|maj|min|dim|aug|sus|add|[0-9])*(?:\/[A-G][#b]?)?)(?![a-zA-Z0-9#b])/g;

        function renderFormattedSong(htmlContent) {
            const compact = htmlContent
                .replace(/(<td[^>]*>)\s+/g, '$1')
                .replace(/\s+(<\/td>)/g, '$1');

            songContainer.innerHTML = compact;

            songContainer.querySelectorAll('.c_C').forEach(span => {
                if (!span.dataset.original) {
                    span.dataset.original = span.textContent;
                }
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allSongs.filter(song =>
                song.Title.toLowerCase().includes(query) ||
                song.Artist.toLowerCase().includes(query)
            );
            renderSongList(filtered);
        });

        function transposeChord(chord, amount) {
            const semitones = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            const flatMap = { 
                "Db": "C#", "Eb": "D#", "Gb": "F#", "Ab": "G#", "Bb": "A#",
                "Cb": "B",  "Fb": "E",  "E#": "F",  "B#": "C"
            };
            
            const match = chord.match(/^([A-G][#b]?)(.*)$/);
            if (!match) return chord;
            
            let root = match[1];
            let modifier = match[2];
            
            if (flatMap[root]) {
                root = flatMap[root];
            }
            
            let index = semitones.indexOf(root);
            if (index === -1) return chord;
            
            let newIndex = (((index + amount) % 12) + 12) % 12;
            let result = semitones[newIndex] + modifier;

            result = result.replace(/##+/g, '#');
            result = result.replace(/b#/g, '#');
            result = result.replace(/bb+/g, 'b');

            return result;
        }

        function shiftChordText(text, semitones) {
            return text.replace(chordRegex, (match, chord) => {
                let parts = chord.split('/');
                let transposedRoot = transposeChord(parts[0], semitones);
                if (parts.length > 1) {
                    let transposedBass = transposeChord(parts[1], semitones);
                    return transposedRoot + '/' + transposedBass;
                }
                return transposedRoot;
            });
        }

        function simplifyChordText(text) {
            return text.replace(chordRegex, (match, chord) => {
                let parts = chord.split('/');
                let simplifiedRoot = simplifySingleChord(parts[0]);
                if (parts.length > 1) {
                    let simplifiedBass = simplifySingleChord(parts[1]);
                    return simplifiedRoot + '/' + simplifiedBass;
                }
                return simplifiedRoot;
            });
        }

        function simplifySingleChord(chord) {
            const match = chord.match(/^([A-G][#b]?)(.*)$/);
            if (!match) return chord;
            let note = match[1];
            let suffix = match[2];

            let isMinor = suffix.startsWith('m') && !suffix.startsWith('maj');
            return note + (isMinor ? 'm' : '');
        }

        function updateSongDisplay() {
            const chordSpans = songContainer.querySelectorAll('.c_C');
            chordSpans.forEach(span => {
                const original = span.dataset.original || span.textContent;
                let text = shiftChordText(original, currentSemitone);
                if (isSimplifyMode) {
                    text = simplifyChordText(text);
                }
                span.textContent = text;
            });
        }

        function transpose(amount) {
            if (!originalHtmlContent) return;
            if (isEasiestMode) {
                isEasiestMode = false;
                updateEasiestKeyUI();
            }
            
            currentSemitone = currentSemitone + Math.round(amount * 2);
            
            let displayVal = currentSemitone / 2;
            transposeValEl.textContent = (displayVal > 0 ? "+" + displayVal : displayVal);
            updateSongDisplay();
        }

        function toggleEasiestKey() {
            if (!originalHtmlContent) return;

            if (isEasiestMode) {
                currentSemitone = previousSemitone;
                isEasiestMode = false;
                updateEasiestKeyUI();
                
                let displayVal = currentSemitone / 2;
                transposeValEl.textContent = (displayVal > 0 ? "+" + displayVal : displayVal);
                updateSongDisplay();
                return;
            }

            const chordSpans = songContainer.querySelectorAll('.c_C');
            if (chordSpans.length === 0) return;

            previousSemitone = currentSemitone;
            let bestShift = 0;
            let minScore = Infinity;

            for (let shift = -6; shift <= 5; shift++) {
                let sharpCount = 0;
                let nonStandardCount = 0;

                chordSpans.forEach(span => {
                    const original = span.dataset.original;
                    if (!original) return;
                    let shifted = shiftChordText(original, shift);
                    let match = shifted.match(/^([A-G][#b]?)/);
                    if (match) {
                        if (match[1].includes('#')) {
                            sharpCount++;
                        } else if (!["C", "G", "D", "A", "F", "E", "Bb", "Eb"].includes(match[1])) {
                            nonStandardCount++;
                        }
                    }
                });

                let score = sharpCount * 1000 + nonStandardCount * 10 + Math.abs(shift);
                if (score < minScore) {
                    minScore = score;
                    bestShift = shift;
                }
            }

            currentSemitone = bestShift;
            isEasiestMode = true;
            updateEasiestKeyUI();
            
            let displayVal = currentSemitone / 2;
            transposeValEl.textContent = (displayVal > 0 ? "+" + displayVal : displayVal);
            updateSongDisplay();
        }

        function updateEasiestKeyUI() {
            if (isEasiestMode) {
                easiestKeyBtn.style.background = 'var(--accent)';
                easiestKeyBtn.style.color = '#050b14';
                easiestKeyBtn.style.borderColor = 'transparent';
                easiestKeyBtn.style.boxShadow = '0 0 15px rgba(56, 189, 248, 0.4)';
            } else {
                easiestKeyBtn.style.background = 'rgba(56, 189, 248, 0.15)';
                easiestKeyBtn.style.color = 'var(--accent)';
                easiestKeyBtn.style.borderColor = 'rgba(56, 189, 248, 0.4)';
                easiestKeyBtn.style.boxShadow = 'none';
            }
        }

        function toggleSimplify() {
            if (!originalHtmlContent) return;
            isSimplifyMode = !isSimplifyMode;
            updateSimplifyUI();
            updateSongDisplay();
        }

        function updateSimplifyUI() {
            if (isSimplifyMode) {
                simplifyBtn.style.background = 'var(--success)';
                simplifyBtn.style.color = '#050b14';
                simplifyBtn.style.borderColor = 'transparent';
                simplifyBtn.style.boxShadow = '0 0 15px rgba(16, 185, 129, 0.4)';
            } else {
                simplifyBtn.style.background = 'rgba(16, 185, 129, 0.15)';
                simplifyBtn.style.color = 'var(--success)';
                simplifyBtn.style.borderColor = 'rgba(16, 185, 129, 0.4)';
                simplifyBtn.style.boxShadow = 'none';
            }
        }

        function toggleAutoScroll() {
            if (isScrolling) {
                stopAutoScroll();
            } else {
                startAutoScroll();
            }
        }

        function startAutoScroll() {
            isScrolling = true;
            autoscrollBtn.textContent = 'Pause ⏸';
            autoscrollBtn.style.backgroundColor = 'var(--warning)';

            autoScrollInterval = setInterval(() => {
                const speed = parseInt(scrollSpeedInput.value);
                scrollContainer.scrollTop += speed * 0.6;

                if (scrollContainer.scrollTop + scrollContainer.clientHeight >= scrollContainer.scrollHeight - 5) {
                    stopAutoScroll();
                }
            }, 60);
        }

        function stopAutoScroll() {
            isScrolling = false;
            clearInterval(autoScrollInterval);
            autoscrollBtn.textContent = 'Play ⏵';
            autoscrollBtn.style.backgroundColor = 'var(--accent)';
        }

        function adjustFontSize(delta) {
            currentFontSize = Math.max(11, Math.min(30, currentFontSize + delta));
            songContainer.style.fontSize = currentFontSize + 'px';
        }

        function copyChords() {
            navigator.clipboard.writeText(songContainer.innerText).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.textContent = 'Copied!';
                btn.style.background = 'var(--success)';
                btn.style.color = '#050b14';
                setTimeout(() => {
                    btn.textContent = 'Copy';
                    btn.style.background = 'rgba(255, 255, 255, 0.05)';
                    btn.style.color = 'var(--text-main)';
                }, 2000);
            });
        }
    </script>
</body>
</html>
