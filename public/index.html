<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TabStudio Pro Max</title>
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-sidebar: #111827;
            --bg-card: #111827;
            --border-color: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 360px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px 20px 14px 20px;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header span {
            color: var(--accent);
            font-size: 11px;
            background: rgba(56, 189, 248, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .search-container {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            background: #0f172a;
        }

        #search-input {
            width: 100%;
            padding: 9px 12px;
            background-color: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        #search-input:focus { border-color: var(--accent); }

        #song-list {
            flex: 1;
            overflow-y: auto;
        }

        .song-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(31, 41, 55, 0.4);
            transition: background-color 0.15s, padding-left 0.15s;
        }

        .song-item:hover {
            background-color: rgba(56, 189, 248, 0.04);
            padding-left: 24px;
        }

        .song-item.active {
            background-color: rgba(56, 189, 248, 0.08);
            border-left: 3px solid var(--accent);
        }

        .song-item strong {
            display: block;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 2px;
        }

        .song-item span {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Main View */
        #main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
        }

        .viewer-header {
            padding: 14px 24px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-sidebar);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .song-meta h1 {
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .song-meta h3 {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: normal;
        }

        .toolbar-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0f172a;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .toolbar-group label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn {
            background-color: #1f2937;
            color: var(--text-main);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: background-color 0.15s;
        }

        .btn:hover { background-color: #374151; }
        .btn-primary { background-color: var(--accent); color: #0b0f19; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-success { background-color: var(--success); color: #0b0f19; }
        .btn-success:hover { opacity: 0.9; }

        input[type="range"] {
            accent-color: var(--accent);
            cursor: pointer;
            width: 70px;
        }

        /* Content Scroll Wrapper */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .content-wrapper {
            max-width: 850px;
            width: 100%;
        }

        pre#song-content {
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            color: #e5e7eb;
            background: var(--bg-card);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .placeholder-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
        }

        .placeholder-state svg {
            width: 40px;
            height: 40px;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            TabStudio Max <span id="song-count">Loading...</span>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search artist or title...">
        </div>
        <div id="song-list"></div>
    </div>

    <!-- Main View -->
    <div id="main-view">
        <div class="viewer-header" id="viewer-header" style="display: none;">
            <div class="song-meta">
                <h1 id="song-title"></h1>
                <h3 id="song-artist"></h3>
            </div>

            <div class="toolbar-container">
                <!-- Transpose Controls -->
                <div class="toolbar-group">
                    <label>Key:</label>
                    <button class="btn" onclick="transpose(-1)">-1</button>
                    <span id="transpose-val" style="font-size: 11px; font-weight: bold; min-width: 16px; text-align: center;">0</span>
                    <button class="btn" onclick="transpose(1)">+1</button>
                    <button class="btn btn-success" onclick="suggestEasyVersion()" title="Reset key">Easy</button>
                </div>

                <!-- Auto Scroll Controls -->
                <div class="toolbar-group">
                    <label>Scroll:</label>
                    <button class="btn btn-primary" id="autoscroll-btn" onclick="toggleAutoScroll()">Play ⏵</button>
                    <input type="range" id="scroll-speed" min="1" max="5" value="1">
                </div>

                <!-- Font & Copy -->
                <div class="toolbar-group">
                    <button class="btn" onclick="adjustFontSize(1)">A+</button>
                    <button class="btn" onclick="adjustFontSize(-1)">A-</button>
                    <button class="btn" onclick="copyChords()" id="copy-btn">Copy</button>
                </div>
            </div>
        </div>

        <div class="content-scroll" id="content-scroll-container">
            <div id="placeholder" class="placeholder-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                </svg>
                <p>Select a song from your library to start playing</p>
            </div>
            <div class="content-wrapper" id="content-wrapper" style="display: none;">
                <pre id="song-content"></pre>
            </div>
        </div>
    </div>

    <script>
        let allSongs = [];
        let currentFontSize = 14;
        let originalSongContent = "";
        let currentSemitone = 0;
        let autoScrollInterval = null;
        let isScrolling = false;

        const songListDiv = document.getElementById('song-list');
        const searchInput = document.getElementById('search-input');
        const viewerHeader = document.getElementById('viewer-header');
        const titleEl = document.getElementById('song-title');
        const artistEl = document.getElementById('song-artist');
        const contentEl = document.getElementById('song-content');
        const contentWrapper = document.getElementById('content-wrapper');
        const placeholderEl = document.getElementById('placeholder');
        const songCountEl = document.getElementById('song-count');
        const scrollContainer = document.getElementById('content-scroll-container');
        const scrollSpeedInput = document.getElementById('scroll-speed');
        const autoscrollBtn = document.getElementById('autoscroll-btn');
        const transposeValEl = document.getElementById('transpose-val');

        fetch('/api/songs')
            .then(res => res.json())
            .then(songs => {
                allSongs = songs;
                songCountEl.textContent = `${songs.length} tabs`;
                renderSongList(songs);
            })
            .catch(() => {
                songCountEl.textContent = 'Error';
                songListDiv.innerHTML = '<div style="padding: 20px; color: #f87171;">Failed to load catalog.</div>';
            });

        function renderSongList(songsToRender) {
            songListDiv.innerHTML = '';
            songsToRender.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-item';
                item.innerHTML = `<strong>${song.Title}</strong><span>${song.Artist}</span>`;

                item.addEventListener('click', () => {
                    stopAutoScroll();
                    document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');

                    placeholderEl.style.display = 'none';
                    viewerHeader.style.display = 'flex';
                    contentWrapper.style.display = 'block';

                    titleEl.textContent = song.Title;
                    artistEl.textContent = song.Artist;
                    contentEl.textContent = "Loading chords...";
                    currentSemitone = 0;
                    transposeValEl.textContent = "0";

                    fetch(`/api/scrape?url=${encodeURIComponent(song.URL)}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.error) {
                                contentEl.textContent = "Error loading song.";
                                return;
                            }
                            originalSongContent = data.content;
                            contentEl.textContent = originalSongContent;

                            const isHebrew = /[\u0590-\u05FF]/.test(song.Title);
                            contentEl.style.direction = isHebrew ? 'rtl' : 'ltr';
                            contentEl.style.textAlign = isHebrew ? 'right' : 'left';
                        })
                        .catch(() => {
                            contentEl.textContent = "Failed to fetch song content.";
                        });
                });
                songListDiv.appendChild(item);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allSongs.filter(song =>
                song.Title.toLowerCase().includes(query) ||
                song.Artist.toLowerCase().includes(query)
            );
            renderSongList(filtered);
        });

        const chordsSharp = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const chordsFlat = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

        function shiftChord(match, chord) {
            let rootMatch = chord.match(/^([A-G][b#]?)(.*)$/);
            if (!rootMatch) return chord;
            let note = rootMatch[1];
            let suffix = rootMatch[2];
            let idx = chordsSharp.indexOf(note);
            if (idx === -1) idx = chordsFlat.indexOf(note);
            if (idx === -1) return chord;
            let newIdx = (idx + currentSemitone + 12) % 12;
            return chordsSharp[newIdx] + suffix;
        }

        function transpose(amount) {
            if (!originalSongContent) return;
            currentSemitone += amount;
            transposeValEl.textContent = (currentSemitone > 0 ? "+" : "") + currentSemitone;
            const transposedText = originalSongContent.replace(/\b([A-G][b#]?(?:m|maj|min|dim|aug|sus|[0-9])*)\b/g, (match, chord) => {
                return shiftChord(match, chord);
            });
            contentEl.textContent = transposedText;
        }

        function suggestEasyVersion() {
            currentSemitone = 0;
            transposeValEl.textContent = "0";
            contentEl.textContent = originalSongContent;
        }

        // Calibrated smooth slow scroll engine
        function toggleAutoScroll() {
            if (isScrolling) {
                stopAutoScroll();
            } else {
                startAutoScroll();
            }
        }

        function startAutoScroll() {
            isScrolling = true;
            autoscrollBtn.textContent = 'Pause ⏸';
            autoscrollBtn.style.backgroundColor = 'var(--warning)';

            autoScrollInterval = setInterval(() => {
                const speed = parseInt(scrollSpeedInput.value);
                // Smoother micro-steps using sub-pixel accumulation logic or slow tick increments
                scrollContainer.scrollTop += speed * 0.6;

                if (scrollContainer.scrollTop + scrollContainer.clientHeight >= scrollContainer.scrollHeight - 5) {
                    stopAutoScroll();
                }
            }, 60);
        }

        function stopAutoScroll() {
            isScrolling = false;
            clearInterval(autoScrollInterval);
            autoscrollBtn.textContent = 'Play ⏵';
            autoscrollBtn.style.backgroundColor = 'var(--accent)';
        }

        function adjustFontSize(delta) {
            currentFontSize = Math.max(11, Math.min(22, currentFontSize + delta));
            contentEl.style.fontSize = currentFontSize + 'px';
        }

        function copyChords() {
            navigator.clipboard.writeText(contentEl.textContent).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 2000);
            });
        }
    </script>
</body>
</html>
